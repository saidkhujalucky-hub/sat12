# Имя Worker совпадает с действующим проектом Cloudflare.
name = "sat12"
main = "worker/index.mjs"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

# Существующая база sat12; сохраняем данные пользователей.
[[d1_databases]]
binding = "DB"
database_name = "sat-platform-db"
database_id = "595f1b8c-adca-46fc-8735-2c87643e2e30"

[vars]
PAYMENT_MODE = "manual"
PREMIUM_PRICE_UZS = "19000"
NODE_ENV = "production"

[ai]
binding = "AI"
